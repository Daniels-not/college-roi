name: Monthly data refresh

# Re-pulls College Scorecard data, rebuilds everything, and commits the
# updated exports/ so the deployed dashboard picks them up automatically.
# Needs a repo secret named SCORECARD_API_KEY
# (Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  schedule:
    - cron: "17 9 3 * *"   # 09:17 UTC on the 3rd of every month
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,analysis]"

      - name: Run pipeline
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
        run: python -m scorecard all

      - name: Commit updated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          if git diff --cached --quiet; then
            echo "No changes in exports/"
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
